<form>
  
  <link rel="stylesheet" href="/www/modals/modal.css">
  
  <header>New Account</header>
  
  <div>
    <i class="fa-solid fa-user"></i>
    <input type="text" name="full_name" autocomplete="name" placeholder="Full Name">
  </div><div>
    <i class="fa-solid fa-building-columns"></i>
    <input type="text" name="affiliation" autocomplete="organization" placeholder="Affiliation">
  </div><div>
    <i class="fa-solid fa-envelope"></i>
    <input type="email" name="email" autocomplete="email" placeholder="Email">
  </div><div>
    <i class="fa-solid fa-key"></i>
    <input type="password" name="password" autocomplete="new-password" placeholder="Password">
  </div>
  
  <button type="button" class="serialize-submit" data-api="create_account">Register</button>
</form>
