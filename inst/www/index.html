<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATIMA</title>
  <link rel="icon" href="/www/img/favicon.ico">
  <link rel="stylesheet" href="/www/assets/fontawesome-6.1.0/css/fontawesome.css">
  <link rel="stylesheet" href="/www/assets/fontawesome-6.1.0/css/solid.css">
  <link rel="stylesheet" href="/www/assets/highlight-default-11-4-0.css">
  <link rel="stylesheet" href="/www/css/app.css">

<body>

  <aside id="nav">
    <a class="nav-logo" href="https://www.bcm.edu/" target="_blank" rel="noopener noreferrer">

    </a>
